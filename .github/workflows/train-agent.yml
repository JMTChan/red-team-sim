name: Train Red Team Agent

# Continuous training loop on a 6-hour cycle:
#   train ~5.5h  ->  ~30-min idle gap  ->  next run starts automatically.
# cron "0 */6 * * *" fires at 00:00, 06:00, 12:00, 18:00 UTC = 4 runs/day.
# Each run resumes from the model the previous run committed, so the agent
# keeps improving around the clock. (24h only fits four 5.5h sessions; five
# would need 27.5h, so 4/day is the practical ceiling at this run length.)
on:
  # schedule:
  #   - cron: "0 */6 * * *"  # every 6 hours (disabled for now — manual runs only)
  workflow_dispatch: {}     # manual "Run workflow" button

# Required so the job can push the new model back to the repo.
permissions:
  contents: write

# Never let two training runs race on the same branch.
concurrency:
  group: train-agent
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    # Hard ceiling below GitHub's 6h limit. The script itself stops at 5.5h.
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main   # always resume from the latest committed model, not the triggering SHA

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r training/requirements.txt

      - name: Train (resume from latest_model.zip if present)
        env:
          TRAIN_MAX_SECONDS: "5400"   # 1.5 hours
        run: python training/train.py

      - name: Commit & push updated model
        if: always()   # push the last checkpoint even if training errored or was cut short
        run: |
          if [ ! -f training/latest_model.zip ] && [ ! -f public/red_team_agent.onnx ]; then
            echo "No model artifacts produced; nothing to push."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Preserve the freshly trained artifacts, then re-anchor onto the latest
          # main before committing — main may have advanced during the long run
          # (e.g. you pushed a file change), which would otherwise reject the push
          # as a non-fast-forward and waste the whole run. Retry to survive a race.
          mkdir -p /tmp/model_out
          cp -f training/latest_model.zip   /tmp/model_out/ 2>/dev/null || true
          cp -f public/red_team_agent.onnx  /tmp/model_out/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp -f /tmp/model_out/latest_model.zip   training/latest_model.zip  2>/dev/null || true
            cp -f /tmp/model_out/red_team_agent.onnx public/red_team_agent.onnx 2>/dev/null || true
            git add training/latest_model.zip public/red_team_agent.onnx
            if git diff --staged --quiet; then
              echo "No model changes to commit."
              exit 0
            fi
            git commit -m "chore: auto-trained model $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push origin HEAD:main; then
              echo "Pushed trained model."
              exit 0
            fi
            echo "push attempt $i failed (main likely moved); re-anchoring and retrying..."
            sleep $((i * 3))
          done
          echo "ERROR: could not push trained model after retries" >&2
          exit 1

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300"
     font-family="'SFMono-Regular','Consolas','Liberation Mono',Menlo,monospace"
     role="img" aria-label="Red Team Network Simulator">
  <defs>
    <radialGradient id="bgGlow" cx="74%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#0e2233"/>
      <stop offset="100%" stop-color="#090d15"/>
    </radialGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#16202e" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1000" height="300" fill="url(#bgGlow)"/>
  <rect width="1000" height="300" fill="url(#grid)" opacity="0.5"/>

  <!-- subtle scanline sweep -->
  <rect x="0" width="1000" height="2" fill="#22d3ee" opacity="0.07">
    <animate attributeName="y" dur="6s" repeatCount="indefinite" values="-4;300;-4"/>
  </rect>

  <!-- ===== network (right) ===== -->
  <!-- edges -->
  <g stroke="#27384a" stroke-width="1.6" fill="none">
    <line x1="540" y1="150" x2="610" y2="80"/>
    <line x1="540" y1="150" x2="628" y2="228"/>
    <line x1="610" y1="80"  x2="745" y2="110"/>
    <line x1="628" y1="228" x2="745" y2="110"/>
    <line x1="628" y1="228" x2="838" y2="212"/>
    <line x1="745" y1="110" x2="822" y2="68"/>
    <line x1="745" y1="110" x2="838" y2="212"/>
    <line x1="822" y1="68"  x2="940" y2="160"/>
    <line x1="838" y1="212" x2="940" y2="160"/>
  </g>

  <!-- plain nodes -->
  <circle cx="610" cy="80"  r="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="838" cy="212" r="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- defense (firewall) nodes with pulsing rings -->
  <circle cx="628" cy="228" r="6" fill="#2a1520" stroke="#f43f5e" stroke-width="1.6"/>
  <circle cx="628" cy="228" r="9" fill="none" stroke="#f43f5e" stroke-width="2">
    <animate attributeName="r" dur="2.2s" repeatCount="indefinite" values="9;15;9"/>
    <animate attributeName="opacity" dur="2.2s" repeatCount="indefinite" values="0.85;0;0.85"/>
  </circle>
  <circle cx="822" cy="68" r="6" fill="#2a1520" stroke="#f43f5e" stroke-width="1.6"/>
  <circle cx="822" cy="68" r="9" fill="none" stroke="#f43f5e" stroke-width="2">
    <animate attributeName="r" dur="2.6s" repeatCount="indefinite" values="9;15;9"/>
    <animate attributeName="opacity" dur="2.6s" repeatCount="indefinite" values="0.85;0;0.85"/>
  </circle>

  <!-- entry (workstation) -->
  <circle cx="540" cy="150" r="6" fill="#334155" stroke="#7d93a5" stroke-width="1.5"/>
  <text x="540" y="174" text-anchor="middle" font-size="9" fill="#64748b" letter-spacing="1">ENTRY</text>

  <!-- foothold (domain controller) -->
  <circle cx="745" cy="110" r="8" fill="#2a2410" stroke="#fbbf24" stroke-width="1.8"/>
  <circle cx="745" cy="110" r="11" fill="none" stroke="#fbbf24" stroke-width="2">
    <animate attributeName="r" dur="2.8s" repeatCount="indefinite" values="11;19;11"/>
    <animate attributeName="opacity" dur="2.8s" repeatCount="indefinite" values="0.8;0;0.8"/>
  </circle>
  <text x="745" y="136" text-anchor="middle" font-size="9" fill="#fbbf24" letter-spacing="1">DC</text>

  <!-- database (target) -->
  <circle cx="940" cy="160" r="9" fill="#0b2e22" stroke="#34d399" stroke-width="2"/>
  <circle cx="940" cy="160" r="13" fill="none" stroke="#34d399" stroke-width="2">
    <animate attributeName="r" dur="2.4s" repeatCount="indefinite" values="13;21;13"/>
    <animate attributeName="opacity" dur="2.4s" repeatCount="indefinite" values="0.9;0;0.9"/>
  </circle>
  <text x="940" y="187" text-anchor="middle" font-size="9" fill="#34d399" letter-spacing="1">DATABASE</text>

  <!-- ===== agent traversing entry -> DC -> database ===== -->
  <g>
    <animateMotion dur="7s" repeatCount="indefinite"
      path="M540,150 L610,80 L745,110 L822,68 L940,160"/>
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite"
      values="0;1;1;1;0" keyTimes="0;0.08;0.5;0.9;1"/>
    <circle r="14" fill="#f43f5e" opacity="0.22"/>
    <circle r="5" fill="#fb7185" filter="url(#glow)"/>
  </g>

  <!-- ===== title (left) ===== -->
  <text x="60" y="118" font-size="48" font-weight="700" fill="url(#titleFill)" filter="url(#glow)">RED TEAM</text>
  <text x="62" y="160" font-size="27" font-weight="700" fill="#22d3ee" letter-spacing="3">NETWORK SIMULATOR</text>
  <text x="64" y="192" font-size="14" fill="#7d93a5">// an AI adversary vs. your defenses &#8212; in the browser</text>

  <!-- detection meter -->
  <text x="64" y="228" font-size="10" fill="#64748b" letter-spacing="2">DETECTION</text>
  <rect x="64" y="236" width="252" height="6" rx="3" fill="#16202e"/>
  <rect x="64" y="236" height="6" rx="3" fill="#22d3ee">
    <animate attributeName="width" dur="7s" repeatCount="indefinite"
      values="0;252;252;0;0" keyTimes="0;0.85;0.92;0.93;1"/>
    <animate attributeName="fill" dur="7s" repeatCount="indefinite"
      values="#22d3ee;#22d3ee;#fbbf24;#f43f5e;#f43f5e" keyTimes="0;0.45;0.7;0.9;1"/>
  </rect>
</svg>
